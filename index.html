<body>
    <div class="container">
        <h1>Freudian Slip Simulator</h1>

        <div class="thoughts-container">
            <h2>Inner Monologue (Subconscious Thoughts):</h2>
            <div id="thoughtsDisplay" class="thoughts-box">
                <p>Thinking...</p>
            </div>
        </div>

        <div class="interaction-container">
            <h2>Your Intention:</h2>
            <textarea id="userInput" placeholder="What do you want to say?"></textarea>
            <button id="speakButton">Try to Say It</button>
            <div id="loadingMessage" style="display: none;">Processing your slip...</div>
        </div>

        <div class="slip-container">
            <h2>You Actually Said:</h2>
            <div id="slipDisplay" class="slip-box">
                <p>...</p>
            </div>
        </div>
    </div>
